<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拾光小筑 · 个人博客</title>
    <style>
        :root {
            --bg-body: #f5f7fa;
            --bg-card: rgba(255, 255, 255, 0.3); ;
            --bg-sidebar: #1e293b;
            --bg-sidebar-hover: #334155;
            --bg-topbar: rgba(255, 255, 255, 0.5);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --text-sidebar:#cbd5e1;
            --text-sidebar-active: #ffffff;
            --accent: #0d9488;
            --accent-hover: #0f766e;
            --accent-soft: rgba(13, 148, 136, 0.1);
            --accent-gold: #b8860b;
            --border: #e2e8f0;
            --border-strong: #cbd5e1;
            --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-full: 9999px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            --font-serif: 'Georgia', 'Noto Serif SC', 'Songti SC', serif;
            --font-mono: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-body);
            /* 添加背景图 */
            background-image: url('./方圆壁纸_群山.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(245, 247, 250, 0.5);
            z-index: -1;
        }

        /* ========== 侧边栏 ========== */
        .sidebar {
            width: 200px;
            min-width: 200px;
            height: 100vh;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
            transition: var(--transition);
        }

        .sidebar-header {
            padding: 20px 16px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }
        .sidebar-header .logo {
            font-family: var(--font-serif);
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.06em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .sidebar-header .logo .logo-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
            animation: pulseDot 2s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.5); opacity: 1; }
        }
        .sidebar-header .slogan {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 0.08em;
        }

        .sidebar-nav {
            flex: 1;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow-y: auto;
        }
        .sidebar-nav .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-sidebar);
            cursor: pointer;
            transition: var(--transition);
            border: none;
            background: transparent;
            font-family: var(--font-sans);
            text-align: left;
            width: 100%;
            user-select: none;
            letter-spacing: 0.03em;
            position: relative;
            text-decoration: none;
        }
        .sidebar-nav .nav-item:hover {
            background: var(--bg-sidebar-hover);
            color: #fff;
        }
        .sidebar-nav .nav-item.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 14px rgba(13, 148, 136, 0.35);
        }
        .sidebar-nav .nav-item .nav-icon {
            font-size: 1.05rem;
            width: 22px;
            text-align: center;
            flex-shrink: 0;
        }
        .sidebar-nav .nav-item .nav-text {
         display: inline;
        }
        .sidebar-nav .nav-item .nav-badge {
            margin-left: auto;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 0.6rem;
            padding: 1px 7px;
            border-radius: 10px;
            font-weight: 600;
        }
        .sidebar-nav .nav-item.active .nav-badge {
            background: rgba(255, 255, 255, 0.3);
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.65rem;
            color: var(--text-muted);
            text-align: center;
            letter-spacing: 0.04em;
        }

        /* ========== 右侧主区域 ========== */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100vh;
        }

        /* ========== 顶部栏 ========== */
        .topbar {
            height: 60px;
            min-height: 60px;
            background: var(--bg-topbar);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            gap: 16px;
            position: relative;
            z-index: 5;
        }
        .topbar .search-box {
            flex: 1;
            max-width: 420px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-body);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            padding: 8px 16px;
            transition: var(--transition);
        }
        .topbar .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
            background: #fff;
        }
        .topbar .search-box .search-icon {
            color: var(--text-muted);
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .topbar .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 0.85rem;
            color: var(--text-primary);
            outline: none;
            font-family: var(--font-sans);
        }
        .topbar .search-box input::placeholder {
            color: var(--text-muted);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .topbar-actions .topbar-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--border);
            background: var(--bg-card);
            font-size: 0.9rem;
            color: var(--text-secondary);
            position: relative;
        }
        .topbar-actions .topbar-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: scale(1.05);
            box-shadow: var(--shadow-sm);
        }
        .topbar-actions .topbar-btn .notification-dot {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ef4444;
        }
        .topbar-actions .btn-write {
            padding: 8px 16px;
            border-radius: var(--radius-full);
            background: var(--accent);
            color: #fff;
            font-size: 0.8rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-sans);
            letter-spacing: 0.03em;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .topbar-actions .btn-write:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 14px rgba(13, 148, 136, 0.35);
        }

        /* ========== 内容区 ========== */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            position: relative;
        }
        .content-area::-webkit-scrollbar {
            width: 4px;
        }
        .content-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .content-area::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 2px;
        }
        .content-area::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* ========== 面板 ========== */
        .panel {
            display: none;
            animation: fadeInUp 0.4s ease both;
            max-width: 900px;
            margin: 0 auto;
        }
        .panel.active {
            display: block;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .panel-header {
            margin-bottom: 20px;
        }
        .panel-header h2 {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.02em;
        }
        .panel-header .panel-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
            font-family: var(--font-mono);
            letter-spacing: 0.06em;
        }

        /* ========== 卡片 ========== */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            margin-bottom: 14px;
        }
        .card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--border-strong);
        }

        /* ========== 首页 ========== */
        .home-hero {
            background: linear-gradient(135deg, var(--accent-soft), rgba(184, 134, 11, 0.06));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 24px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        .home-hero .hero-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0d9488, #b8860b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 8px 24px rgba(13, 148, 136, 0.3);
        }
        .home-hero .hero-text h3 {
            font-size: 1.2rem;
            font-weight: 700;
            font-family: var(--font-serif);
        }
        .home-hero .hero-text p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
            line-height: 1.6;
        }

        .home-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .home-stat {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            text-align: center;
            transition: var(--transition);
        }
        .home-stat:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }
        .home-stat .hs-value {
            font-size: 1.5rem;
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--accent);
            line-height: 1.2;
        }
        .home-stat .hs-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 2px;
        }

        /* ========== 说说/文章列表 ========== */
        .post-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .post-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
        }
        .post-item:hover {
            border-color: var(--accent);
            transform: translateX(4px);
            box-shadow: var(--shadow-sm);
        }
        .post-item .post-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-family: var(--font-mono);
        }
        .post-item .post-meta .post-tag {
            padding: 1px 8px;
            border-radius: 10px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.6rem;
            font-weight: 600;
        }
        .post-item .post-content {
            font-size: 0.85rem;
            color: var(--text-primary);
            line-height: 1.7;
            word-break: break-word;
        }
        .post-item .post-content .post-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 2px;
        }
        .post-item .delete-btn {
            position: absolute;
            top: 10px;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 4px;
            border-radius: 4px;
            opacity: 0;
            transition: var(--transition);
        }
        .post-item:hover .delete-btn {
            opacity: 1;
        }
        .post-item .delete-btn:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.08);
        }

        /* ========== 时间轴（归档） ========== */
        .timeline {
            position: relative;
            padding-left: 28px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, var(--accent), rgba(13, 148, 136, 0.1));
            border-radius: 1px;
        }
        .timeline-group {
            margin-bottom: 20px;
        }
        .timeline-group-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent);
            font-family: var(--font-mono);
            margin-bottom: 10px;
            letter-spacing: 0.06em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .timeline-group-title .year-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
        }
        .timeline-item {
            position: relative;
            padding: 10px 14px;
            margin-bottom: 6px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            transition: var(--transition);
            cursor: pointer;
        }
        .timeline-item:hover {
            border-color: var(--accent);
            transform: translateX(4px);
            box-shadow: var(--shadow-sm);
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -24px;
            top: 18px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .timeline-item .ti-date {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }
        .timeline-item .ti-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* ========== 账号链接 ========== */
        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }
        .account-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }
        .account-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        .account-card .ac-icon {
            font-size: 2rem;
            margin-bottom: 6px;
        }
        .account-card .ac-name {
            font-size: 0.8rem;
            font-weight: 600;
        }
        .account-card .ac-link {
            font-size: 0.68rem;
            color: var(--text-muted);
            word-break: break-all;
        }
        .account-card {
        position: relative;  /* 确保已经有了 */
        }

        .account-delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.3);
            border: none;
            color: #fff;
            font-size: 0.7rem;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s, background 0.3s;
            z-index: 2;
        }

        .account-card:hover .account-delete-btn {
            opacity: 1;
        }

        .account-delete-btn:hover {
            background: #ef4444;
        }
        /* ========== 表单 ========== */
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 9px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-family: var(--font-sans);
            color: var(--text-primary);
            outline: none;
            transition: var(--transition);
            background: var(--bg-card);
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
            font-family: var(--font-sans);
        }
        .btn {
            padding: 9px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            font-family: var(--font-sans);
            letter-spacing: 0.03em;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            user-select: none;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 14px rgba(13, 148, 136, 0.3);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-strong);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ========== 空状态 ========== */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border: 2px dashed var(--border-strong);
            border-radius: var(--radius);
            font-family: var(--font-serif);
            font-style: italic;
        }

        /* ========== Toast ========== */
        #toastContainer {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #toastContainer .toast {
            background: rgba(30, 41, 59, 0.92);
            color: #fff;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            font-size: 0.78rem;
            box-shadow: var(--shadow-lg);
            animation: toastIn 0.35s ease both;
            font-family: var(--font-sans);
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .sidebar {
                width: 64px;
                min-width: 64px;
            }
            .sidebar-header .logo span:not(.logo-dot),
            .sidebar-header .slogan,
            .sidebar-nav .nav-item span:not(.nav-icon),
            .sidebar-nav .nav-item .nav-badge,
            .sidebar-footer {
                display: none;
            }
            .sidebar-nav .nav-item {
                justify-content: center;
                padding: 10px 8px;
            }
            .sidebar-nav .nav-item .nav-icon {
                font-size: 1.2rem;
            }
            
            .topbar {
                padding: 0 12px;
            }
            .content-area {
                padding: 16px 12px;
            }
            .topbar-actions .btn-write span {
                display: none;
            }
            .topbar-actions .btn-write {
                padding: 8px 12px;
                border-radius: 50%;
            }
        }

        @media (max-width: 480px) {
            .home-hero {
                flex-direction: column;
                text-align: center;
            }
            .home-stats {
                grid-template-columns: repeat(2, 1fr);
            }
            .accounts-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
         
    </style>
</head>
<body >

    <!-- ========== 侧边栏 ========== -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo"><span class="logo-dot"></span><span>拾光小筑</span></div>
            <div class="slogan">记录生活的微光</div>
        </div>
        <div class="sidebar-nav" id="sidebarNav">
            <button class="nav-item active" data-panel="home">

    <!-- ========== 右侧主区域 ========== -->
    <div class="main-area">

        <!-- 顶部栏 -->
        <div class="topbar">
            <div class="search-box">
                <span class="search-icon">🔍</span>

            <div class="topbar-actions">
                <button class="topbar-btn" title="通知"><span>🔔</span><span class="notification-dot"></span></button>

                <button class="btn-write" id="btnWriteTop"><span>✍️</span><span>写点什么</span></button>
            </div>
        </div>

        <!-- 内容区 -->
        <div class="content-area" id="contentArea">

            <!-- ========== 首页面板 ========== -->
            <div class="panel active" id="panel-home">
                <div class="panel-header">
                    <h2>🏠 首页</h2>
                    <div class="panel-subtitle">welcome back, 今天也要好好生活</div>
                </div>

                <div class="home-hero">
                    <div class="hero-avatar">🦉</div>
                    <div class="hero-text">
                        <h3>你好，我是拾光者</h3>
                        <p>用文字和代码记录生活的点滴。喜欢阅读、写作，也热爱探索技术的边界。这里是我的数字花园，欢迎你来逛逛。</p>
                    </div>
                </div>

                <div class="home-stats" id="homeStats">
                    <div class="home-stat">
                        <div class="hs-value" id="hsArticles">0</div>
                        <div class="hs-label">文章</div>
                    </div>
                    <div class="home-stat">
                        <div class="hs-value" id="hsChatters">0</div>
                        <div class="hs-label">说说</div>
                    </div>
                    <div class="home-stat">
                        <div class="hs-value" id="hsAccounts">0</div>
                        <div class="hs-label">账号链接</div>
                    </div>
                    <div class="home-stat">
                        <div class="hs-value" id="hsDays">0</div>
                        <div class="hs-label">建站天数</div>
                    </div>
                </div>

                <div class="card">
                    <div style="font-size:0.85rem;font-weight:600;margin-bottom:10px;">📌 最新动态</div>
                    <div id="homeRecentFeed" style="font-size:0.8rem;color:var(--text-secondary);"></div>
                </div>
            </div>

            <!-- ========== 说说面板 ========== -->
            <div class="panel" id="panel-chatter">
                <div class="panel-header">
                    <h2>💭 说说</h2>
                    <div class="panel-subtitle">分享此刻的心情与想法</div>
                </div>

                <div class="card" id="chatterWriteCard">
                    <div class="form-group">
                        <label>发布说说</label>
                        <textarea id="chatterInput" rows="2" placeholder="此刻在想什么...?"></textarea>
                    </div>
                    <div style="display:flex;justify-content:flex-end;">
                        <button class="btn btn-primary" id="chatterSubmitBtn">发布</button>
                    </div>

                <div class="post-list" id="chatterList"></div>
            </div>

            <!-- ========== 文章面板 ========== -->
            <div class="panel" id="panel-articles">
                <div class="panel-header">
                    <h2>📝 文章</h2>
                    <div class="panel-subtitle">记录思考与学习</div>
                </div>

                <div class="card" id="articleWriteCard" style="display:none;">
                    <div class="form-group">
                        <label>文章标题</label>
                        <input type="text" id="articleTitleInput" placeholder="给文章起个标题...">
                    </div>
                    <div class="form-group">
                        <label>文章内容</label>
                        <textarea id="articleContentInput" rows="4" placeholder="写点什么..."></textarea>
                    </div>
                    <div style="display:flex;gap:8px;justify-content:flex-end;">
                        <button class="btn btn-outline" id="articleCancelBtn">取消</button>
                        <button class="btn btn-primary" id="articleSubmitBtn">发布</button>
                    </div>

                <div class="post-list" id="articleList"></div>
            </div>

            <!-- ========== 账号链接面板 ========== -->
            <div class="panel" id="panel-accounts">
                <div class="panel-header">
                    <h2>🔗 账号链接</h2>
                    <div class="panel-subtitle">我的社交账号与联系方式</div>
                </div>

                <div class="card">
                    <div style="font-size:0.78rem;font-weight:600;margin-bottom:10px;">➕ 添加账号链接</div>
                    <div class="form-group">
                        <label>平台名称</label>
                        <input type="text" id="accountNameInput" placeholder="如：GitHub / 微博 / B站 / 知乎...">
                    </div>
                    <div class="form-group">
                        <label>链接地址</label>
                        <input type="text" id="accountUrlInput" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>图标 (emoji)</label>
                        <input type="text" id="accountIconInput" placeholder="如：🐙 / 📺 / 📚" value="🔗">
                    </div>
                    <div style="display:flex;justify-content:flex-end;">
                        <button class="btn btn-primary" id="accountSubmitBtn">添加</button>

                    </div>
                </div>

                <div class="accounts-grid" id="accountsList">
                    <div><button>❌</button></div>
                </div>
            </div>

            <!-- ========== 归档面板 ========== -->
            <div class="panel" id="panel-archive">
                <div class="panel-header">
                    <h2>📚 归档</h2>
                    <div class="panel-subtitle">时间轴 · 记录文章发布历程</div>
                </div>

                <div class="timeline" id="timelineContainer"></div>
            </div>

        </div>
    </div>

    <!-- Toast容器 -->
    <div id="toastContainer"></div>

    <script>
        (function() {
            // ========== 存储键 ==========
            const KEYS = {
                chatters: 'blog_chatters_v2',
                articles: 'blog_articles_v2',
                accounts: 'blog_accounts_v2',
                settings: 'blog_settings_v2',
            };

            // ========== 状态 ==========
            let chatters = [];
            let articles = [];
            let accounts = [];
            let currentPanel = 'home';
            let searchQuery = '';

            // ========== DOM元素 ==========
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);
            const sidebarNav = $('#sidebarNav');
            const contentArea = $('#contentArea');
            const toastContainer = $('#toastContainer');

            // ========== 工具函数 ==========
            function generateId() { return Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 9); }
            function getTodayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
            function getNowTime() { const d = new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
            function formatDateCN(dateStr) {
                if (!dateStr) return '';
                const d = new Date(dateStr);
                if (isNaN(d)) return dateStr;
                const weekdays = ['日','一','二','三','四','五','六'];
                return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 周${weekdays[d.getDay()]}`;
            }
            function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
            function showToast(msg) {
                const t = document.createElement('div');
                t.className = 'toast';
                t.textContent = msg;
                toastContainer.appendChild(t);
                setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 2000);
            }

            // ========== 数据加载/保存 ==========
            function loadData() {
                try { const d = localStorage.getItem(KEYS.chatters); if (d) chatters = JSON.parse(d); } catch(e) {}
                if (!Array.isArray(chatters)) chatters = [];
                try { const d = localStorage.getItem(KEYS.articles); if (d) articles = JSON.parse(d); } catch(e) {}
                if (!Array.isArray(articles)) articles = [];
                try { const d = localStorage.getItem(KEYS.accounts); if (d) accounts = JSON.parse(d); } catch(e) {}
                if (!Array.isArray(accounts)) accounts = [];

                // 示例数据
                if (chatters.length === 0 && articles.length === 0 && accounts.length === 0) {
                    const today = getTodayStr();
                    chatters = [
                        { id: generateId(), content: '今天正式开始搭建自己的博客小站，加油！', date: today, time: '09:15' },
                        { id: generateId(), content: '毛玻璃效果真的太治愈了～', date: today, time: '12:30' },
                        { id: generateId(), content: '想到一个好点子，准备写篇文章记录一下。', date: today, time: '18:45' },
                    ];
                    articles = [
                        { id: generateId(), title: '欢迎来到拾光小筑', date: today, time: '10:00', content: '这是我在拾光小筑的第一篇文章。\n\n这里会记录我的学习、思考和生活中的美好瞬间。\n\n希望你能在这里找到一些有价值的东西。' },
                        { id: generateId(), title: '关于毛玻璃设计的一点思考', date: today, time: '14:20', content: '毛玻璃（Glassmorphism）是近年流行的设计风格。\n\n它通过背景模糊和半透明来创造层次感，让界面看起来更轻盈、更有深度。' },
                        { id: generateId(), title: '我的阅读清单（持续更新）', date: today, time: '16:00', content: '1. 《人类简史》\n2. 《设计中的设计》\n3. 《计算机程序的构造和解释》\n4. 《思考，快与慢》' },
                    ];
                    accounts = [
                        { id: generateId(), name: 'GitHub', url: 'https://github.com', icon: '🐙' },
                        { id: generateId(), name: '微博', url: 'https://weibo.com', icon: '📱' },
                        { id: generateId(), name: 'Bilibili', url: 'https://bilibili.com', icon: '📺' },
                        { id: generateId(), name: '知乎', url: 'https://zhihu.com', icon: '📚' },
                        { id: generateId(), name: 'Email', url: 'mailto:hello@example.com', icon: '✉️' },
                    ];
                    saveAll();
                }
            }
            function saveChatters() { localStorage.setItem(KEYS.chatters, JSON.stringify(chatters)); }
            function saveArticles() { localStorage.setItem(KEYS.articles, JSON.stringify(articles)); }
            function saveAccounts() { localStorage.setItem(KEYS.accounts, JSON.stringify(accounts)); }
            function saveAll() { saveChatters(); saveArticles(); saveAccounts(); }

            // ========== 导航切换 ==========
            sidebarNav.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    const panel = item.dataset.panel;
                    switchPanel(panel);
                });
            });

            function switchPanel(panel) {
                currentPanel = panel;
                sidebarNav.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                sidebarNav.querySelector(`.nav-item[data-panel="${panel}"]`)?.classList.add('active');
                $$('.panel').forEach(p => p.classList.remove('active'));
                const panelEl = $(`#panel-${panel}`);
                if (panelEl) {
                    panelEl.classList.add('active');
                    panelEl.style.animation = 'none';
                    void panelEl.offsetWidth;
                    panelEl.style.animation = 'fadeInUp 0.4s ease both';
                }
                // 刷新面板内容
                if (panel === 'home') renderHome();
                if (panel === 'chatter') renderChatters();
                if (panel === 'articles') renderArticles();
                if (panel === 'accounts') renderAccounts();
                if (panel === 'archive') renderArchive();
                // 滚动到顶部
                contentArea.scrollTop = 0;
            }

            // ========== 首页渲染 ==========
            function renderHome() {
                $('#hsArticles').textContent = articles.length;
                $('#hsChatters').textContent = chatters.length;
                $('#hsAccounts').textContent = accounts.length;
                const days = Math.floor((Date.now() - new Date('2026-01-01').getTime()) / 86400000);
                $('#hsDays').textContent = days;

                // 最新动态
                const feed = [];
                chatters.forEach(c => feed.push({ type: '说说', date: c.date, time: c.time, content: c.content }));
                articles.forEach(a => feed.push({ type: '文章', date: a.date, time: a.time, content: a.title }));
                feed.sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
                const recent = feed.slice(0, 5);
                if (recent.length === 0) {
                    $('#homeRecentFeed').innerHTML = '<span style="color:var(--text-muted);">暂无动态</span>';
                } else {
                    $('#homeRecentFeed').innerHTML = recent.map(f => `
                        <div style="display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--border);">
                            <span style="flex-shrink:0;">${f.type === '说说' ? '💭' : '📝'}</span>
                            <span style="flex:1;word-break:break-word;">${escapeHtml(f.content)}</span>
                            <span style="flex-shrink:0;font-size:0.65rem;color:var(--text-muted);">${f.date.slice(5)} ${f.time}</span>
                        </div>
                    `).join('');
                }
            }

            // ========== 说说渲染 ==========
            function renderChatters() {
                $('#chatterBadge').textContent = chatters.length;
                const list = $('#chatterList');
                const filtered = searchQuery ? chatters.filter(c => c.content.toLowerCase().includes(searchQuery.toLowerCase())) : chatters;
                if (filtered.length === 0) {
                    list.innerHTML = '<div class="empty-state">暂无说说，来说点什么吧 💭</div>';
                } else {
                    const sorted = [...filtered].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
                    list.innerHTML = sorted.map(c => `
                        <div class="post-item" data-id="${c.id}">
                            <div class="post-meta">
                                <span>💭</span>
                                <span>${formatDateCN(c.date)}</span>
                                <span>${c.time || ''}</span>
                            </div>
                            <div class="post-content">${escapeHtml(c.content)}</div>
                            <button class="delete-btn" data-type="chatter" data-id="${c.id}">✕</button>
                        </div>
                    `).join('');
                    // 删除事件
                    list.querySelectorAll('.delete-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            deleteItem('chatter', btn.dataset.id);
                        });
                    });
                }
            }

            // ========== 文章渲染 ==========
            function renderArticles() {
                $('#articleBadge').textContent = articles.length;
                const list = $('#articleList');
                const filtered = searchQuery ? articles.filter(a => a.title.toLowerCase().includes(searchQuery.toLowerCase()) || a.content.toLowerCase().includes(searchQuery.toLowerCase())) : articles;
                if (filtered.length === 0) {
                    list.innerHTML = '<div class="empty-state">暂无文章，写一篇吧 📝</div>';
                } else {
                    const sorted = [...filtered].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
                    list.innerHTML = sorted.map(a => `
                        <div class="post-item" data-id="${a.id}">
                            <div class="post-meta">
                                <span>📝</span>
                                <span>${formatDateCN(a.date)}</span>
                                <span>${a.time || ''}</span>
                            </div>
                            <div class="post-content">
                                <div class="post-title">${escapeHtml(a.title)}</div>
                                <div style="font-size:0.78rem;color:var(--text-secondary);margin-top:2px;">${escapeHtml(a.content.slice(0, 80))}${a.content.length > 80 ? '...' : ''}</div>
                            </div>
                            <button class="delete-btn" data-type="article" data-id="${a.id}">✕</button>
                        </div>
                    `).join('');
                    // 点击文章查看详情
                    list.querySelectorAll('.post-item').forEach(item => {
                        item.addEventListener('click', (e) => {
                            if (e.target.classList.contains('delete-btn')) return;
                            showArticleDetail(item.dataset.id);
                        });
                    });
                    list.querySelectorAll('.delete-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            deleteItem('article', btn.dataset.id);
                        });
                    });
                }
            }

            function showArticleDetail(id) {
                const article = articles.find(a => a.id === id);
                if (!article) return;
                // 使用简单的模态展示
                const modal = document.createElement('div');
                modal.style.cssText = 'position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.5);display:flex;justify-content:center;align-items:center;backdrop-filter:blur(4px);';
                modal.innerHTML = `
                    <div style="background:#fff;border-radius:16px;max-width:560px;width:90%;max-height:80vh;overflow-y:auto;padding:28px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.2);">
                        <button style="position:absolute;top:12px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:#94a3b8;" onclick="this.parentElement.parentElement.remove()">×</button>
                        <h3 style="font-family:var(--font-serif);font-size:1.2rem;font-weight:700;margin-bottom:8px;">${escapeHtml(article.title)}</h3>
                        <div style="font-size:0.7rem;color:#94a3b8;margin-bottom:16px;">${formatDateCN(article.date)} ${article.time || ''}</div>
                        <div style="font-size:0.85rem;line-height:1.8;white-space:pre-wrap;color:#1e293b;">${escapeHtml(article.content)}</div>
                    </div>
                `;
                document.body.appendChild(modal);
                modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
            }

            // ========== 账号链接渲染 ==========
            function renderAccounts() {
                const list = $('#accountsList');
                const filtered = searchQuery ? accounts.filter(a => a.name.toLowerCase().includes(searchQuery.toLowerCase()) || a.url.toLowerCase().includes(searchQuery.toLowerCase())) : accounts;
                if (filtered.length === 0) {
                    list.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">暂无账号链接</div>';
                } else {
                    list.innerHTML = filtered.map(a => `
                        <div class="account-card" data-id="${a.id}" data-url="${escapeHtml(a.url)}">
                            <div class="ac-icon">${escapeHtml(a.icon || '🔗')}</div>
                            <div class="ac-name">${escapeHtml(a.name)}</div>
                            <div class="ac-link">${escapeHtml(a.url.replace('https://', '').replace('mailto:', ''))}</div>                           
                            <button class="account-delete-btn" data-id="${a.id}">✕</button>                            
                        </div>
                    `).join('');
                    // 点击打开链接
                    list.querySelectorAll('.account-card').forEach(card => {
                        card.addEventListener('click', (e) => {
                            if (e.target.classList.contains('account-delete-btn')) return;
                            const url = card.dataset.url;
                            if (url && url !== '#' && url !== '') {
                                window.open(url, '_blank');
                            }
                        });
                    });
                    list.querySelectorAll('.delete-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            deleteItem('account', btn.dataset.id);
                        });
                    });
                    // 删除账号链接
                    list.querySelectorAll('.account-delete-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            deleteItem('account', btn.dataset.id);
                        });
                    });
                }
            }

            // ========== 归档渲染 ========== */
            function renderArchive() {
                const container = $('#timelineContainer');
                if (articles.length === 0) {
                    container.innerHTML = '<div class="empty-state">暂无文章，归档为空</div>';
                    return;
                }
                // 按年份分组
                const groups = {};
                articles.forEach(a => {
                    const year = a.date ? a.date.slice(0, 4) : '未知';
                    if (!groups[year]) groups[year] = [];
                    groups[year].push(a);
                });
                const years = Object.keys(groups).sort().reverse();
                let html = '';
                years.forEach(year => {
                    const items = groups[year].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
                    html += `
                        <div class="timeline-group">
                            <div class="timeline-group-title"><span class="year-dot"></span>${year} 年 · ${items.length} 篇文章</div>
                            ${items.map(a => `
                                <div class="timeline-item" data-id="${a.id}">
                                    <div class="ti-date">${formatDateCN(a.date)}${a.time ? ' · ' + a.time : ''}</div>
                                    <div class="ti-title">${escapeHtml(a.title)}</div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                });
                container.innerHTML = html;
                // 点击时间轴跳转文章详情
                container.querySelectorAll('.timeline-item').forEach(item => {
                    item.addEventListener('click', () => {
                        showArticleDetail(item.dataset.id);
                    });
                });
            }

            // ========== 删除 ========== */
            function deleteItem(type, id) {
                let msg = '';
                if (type === 'chatter') {
                    chatters = chatters.filter(c => c.id !== id);
                    saveChatters();
                    msg = '说说已删除';
                    renderChatters();
                } else if (type === 'article') {
                    articles = articles.filter(a => a.id !== id);
                    saveArticles();
                    msg = '文章已删除';
                    renderArticles();
                } else if (type === 'account') {
                    accounts = accounts.filter(a => a.id !== id);
                    saveAccounts();
                    msg = '账号链接已删除';
                    renderAccounts();
                }
                renderHome();
                showToast(msg);
            }

            // ========== 事件绑定 ========== */
            // 发布说说
            $('#chatterSubmitBtn').addEventListener('click', () => {
                const input = $('#chatterInput');
                const content = input.value.trim();
                if (!content) return showToast('说点什么吧...');
                chatters.push({ id: generateId(), content, date: getTodayStr(), time: getNowTime() });
                saveChatters();
                input.value = '';
                renderChatters();
                renderHome();
                showToast('说说已发布');
            });
            $('#chatterInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    $('#chatterSubmitBtn').click();
                }
            });

            // 写文章按钮（顶部）
            $('#btnWriteTop').addEventListener('click', () => {
                switchPanel('articles');
                const card = $('#articleWriteCard');
                card.style.display = 'block';
                card.scrollIntoView({ behavior: 'smooth' });
            });

            // 文章发布
            $('#articleSubmitBtn').addEventListener('click', () => {
                const title = $('#articleTitleInput').value.trim();
                const content = $('#articleContentInput').value.trim();
                if (!title) return showToast('请输入文章标题');
                if (!content) return showToast('请输入文章内容');
                articles.push({ id: generateId(), title, content, date: getTodayStr(), time: getNowTime() });
                saveArticles();
                $('#articleTitleInput').value = '';
                $('#articleContentInput').value = '';
                $('#articleWriteCard').style.display = 'none';
                renderArticles();
                renderHome();
                showToast('文章已发布');
            });

            // 取消写文章
            $('#articleCancelBtn').addEventListener('click', () => {
                $('#articleWriteCard').style.display = 'none';
                $('#articleTitleInput').value = '';
                $('#articleContentInput').value = '';
            });

            // 添加账号
            $('#accountSubmitBtn').addEventListener('click', () => {
                const name = $('#accountNameInput').value.trim();
                const url = $('#accountUrlInput').value.trim();
                const icon = $('#accountIconInput').value.trim() || '🔗';
                if (!name) return showToast('请输入平台名称');
                if (!url) return showToast('请输入链接地址');
                accounts.push({ id: generateId(), name, url, icon });
                saveAccounts();
                $('#accountNameInput').value = '';
                $('#accountUrlInput').value = '';
                $('#accountIconInput').value = '🔗';
                renderAccounts();
                renderHome();
                showToast('账号链接已添加');
            });

            // 全局搜索
            $('#globalSearch').addEventListener('input', (e) => {
                searchQuery = e.target.value.trim();
                // 根据当前面板刷新
                if (currentPanel === 'chatter') renderChatters();
                if (currentPanel === 'articles') renderArticles();
                if (currentPanel === 'accounts') renderAccounts();
                // 如果搜索有内容且当前在首页，可以跳转到文章或说说
                if (searchQuery && currentPanel === 'home') {
                    switchPanel('articles');
                }
            });

            // ========== 初始化 ========== */
            function init() {
                loadData();
                renderHome();
                renderChatters();
                renderArticles();
                renderAccounts();
                renderArchive();
            }
            init();
        })();
    </script>
</body>
</html>
